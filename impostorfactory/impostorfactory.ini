[config]
# Lower value = faster mouse, higher value = slower mouse
mouse_scale = 6114
mouse_delay = 16
mouse_slow_scale = 30

[controls]
a = "enter"
b = "esc"
x = "leftshift"
# Y: hold for slow/precise mouse cursor
y = mouse_slow

# Mouse clicks (the game has click-to-interact / point-and-click segments)
r1 = mouse_left
l1 = mouse_right

# Page left / page right in menus (RGSS L / R = Q / W)
l2 = "q"
r2 = "w"

start = "enter"
back = "esc"
guide =

up = "w"
down = "s"
left = "a"
right = "d"

# Left stick moves the mouse cursor
left_analog = mouse_movement
right_analog =
